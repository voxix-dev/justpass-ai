[project]
name = "api"
version = "0.0.0"
description = "FastAPI service: Jobs API, Context API, dispatcher."
requires-python = ">=3.14"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn"]  # used as the server binary, never imported
