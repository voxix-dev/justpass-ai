[project]
name = "api"
version = "0.0.0"
description = "FastAPI service: Jobs API, Context API, dispatcher."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.115",
    "pydantic>=2.14",
    "pyjwt[crypto]>=2.15",
    "shared",
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.deptry.per_rule_ignores]
# uvicorn: the server binary. alembic: used by migrations/ and its CLI. asyncpg: the Postgres
# driver, which SQLAlchemy loads from the postgresql+asyncpg:// URL. None of them is imported in src.
DEP002 = ["uvicorn", "alembic", "asyncpg"]

[tool.uv.sources]
shared = { workspace = true }
