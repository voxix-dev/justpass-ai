// The part of Substrate's Control API (pkg/proto/ateapipb/ateapi.proto in the Substrate repo) that
// this repo calls. Field numbers and names match upstream; everything else is left out.
//
// After changing this file, from the repo root (grpcio-tools is pinned in uv.lock):
//   uv run python -m grpc_tools.protoc -I apps/api/src/api --python_out=apps/api/src/api \
//     --pyi_out=apps/api/src/api apps/api/src/api/ate.proto
// CI checks that the generated ate_pb2.py and ate_pb2.pyi are up to date, that `buf lint` and
// `buf format` pass, and that tests/test_ate_proto.py still finds every field in upstream.
syntax = "proto3";

package ateapi;

message ObjectRef {
  string atespace = 1;
  string name = 2;
}

message ResourceMetadata {
  string atespace = 1;
  string name = 2;
  string uid = 3;
  int64 version = 4;
}

message Actor {
  ResourceMetadata metadata = 1;
  ObjectRef actor_template = 2;
}

message CreateActorRequest {
  Actor actor = 1;
}

message SuspendActorRequest {
  ObjectRef actor = 1;
}

message DeleteActorRequest {
  ObjectRef actor = 1;
}

message Atespace {
  ResourceMetadata metadata = 1;
}

message CreateAtespaceRequest {
  Atespace atespace = 1;
}

// SnapshotFidelity orders the state layers a snapshot can hold, lowest to highest.
enum SnapshotFidelity {
  SNAPSHOT_FIDELITY_UNSPECIFIED = 0;
  SNAPSHOT_FIDELITY_VOLUMES = 1;
  SNAPSHOT_FIDELITY_ROOTFS = 2;
  SNAPSHOT_FIDELITY_MEMORY = 3;
}

message Selector {
  map<string, string> match_labels = 1;
}

message HttpGetAction {
  string path = 1;
  int32 port = 2;
}

message WakeupProbe {
  HttpGetAction http_get = 1;
  int32 timeout_seconds = 2;
}

message Container {
  string name = 1;
  string image = 2;
  WakeupProbe wakeup_probe = 6;
}

message Resources {
  int64 cpu_millicores = 1;
  int64 memory_bytes = 2;
}

message ResourceRequirements {
  Resources limits = 1;
}

message SnapshotConfig {
  SnapshotFidelity preferred_fidelity = 2;
}

message GoldenSnapshotStatus {
  ObjectRef golden_tag = 1;
  string error_message = 3;
}

message ActorTemplateStatus {
  GoldenSnapshotStatus golden_snapshot_status = 1;
}

message ActorTemplate {
  ResourceMetadata metadata = 1;
  Selector worker_selector = 2;
  repeated Container containers = 3;
  SnapshotConfig snapshot_config = 5;
  ResourceRequirements resources = 6;
  ActorTemplateStatus status = 7;
}

message CreateActorTemplateRequest {
  ActorTemplate actor_template = 1;
}

message GetActorTemplateRequest {
  ObjectRef actor_template = 1;
}

message AccessPolicy {
  ResourceMetadata metadata = 1;
  repeated Binding bindings = 2;
}

message Binding {
  string role = 1;
  repeated string members = 2;
}

message GetAtespaceAccessPolicyRequest {
  ObjectRef atespace = 1;
  string name = 2;
}

message CreateAtespaceAccessPolicyRequest {
  ObjectRef atespace = 1;
  AccessPolicy access_policy = 2;
}

message UpdateAtespaceAccessPolicyRequest {
  ObjectRef atespace = 1;
  AccessPolicy access_policy = 2;
}

message EgressPolicy {
  ResourceMetadata metadata = 1;
  repeated EgressRule rules = 2;
}

message EgressRule {
  HttpRule http = 1;
  TlsPassthroughRule tls_passthrough = 3;
}

message HttpRule {
  repeated string hostnames = 1;
  Ports ports = 2;
}

message TlsPassthroughRule {
  repeated string hostnames = 1;
  Ports ports = 2;
}

message Ports {
  AllPorts all = 1;
  repeated int32 numbers = 2;
}

message AllPorts {}

message GetActorEgressPolicyRequest {
  ObjectRef actor = 1;
  string name = 2;
}

message UpdateActorEgressPolicyRequest {
  ObjectRef actor = 1;
  EgressPolicy egress_policy = 2;
}

message CreateActorEgressPolicyRequest {
  ObjectRef actor = 1;
  EgressPolicy egress_policy = 2;
}
