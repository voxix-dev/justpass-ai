[project]
name = "agent"
version = "0.0.0"
description = "Agent harness: orchestrator, run_agent, role tool lists, playbooks. Runs inside a Substrate actor."
requires-python = ">=3.14"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "shared"]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.deptry.package_module_name_map]
pyyaml = "yaml"
