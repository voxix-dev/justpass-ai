[project]
name = "agent"
version = "0.0.0"
description = "The agent: the HTTP server that runs inside a Substrate actor."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.16.0",
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=2.68.0",
    "shared",
    "sympy>=1.14.0",
    "uvicorn>=0.30",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.deptry.per_rule_ignores]
# uvicorn: the server binary, not imported in src.
DEP002 = ["uvicorn"]
