[project]
name = "sandbox"
version = "0.0.0"
description = "Runs model-written Python inside its own Substrate actor: no network, no tokens, no user data."
requires-python = ">=3.14"
dependencies = ["pydantic>=2.7", "shared"]

[project.optional-dependencies]
# What scripts can import, installed only in the sandbox image. Homework math needs symbolic
# algebra and calculus (sympy), arrays and linear algebra (numpy), and statistics, integration,
# optimisation and ODEs (scipy). Nothing for plots: run_code returns text only.
math = ["numpy>=2.3", "scipy>=1.16", "sympy>=1.14"]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox"]

[tool.deptry.per_rule_ignores]
DEP002 = ["numpy", "scipy", "sympy"]  # imported by the scripts we run, not by our code
