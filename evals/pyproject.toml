[project]
name = "evals"
version = "0.0.0"
description = "Homework eval set and scorer: samples, deterministic checks, LLM-judge interface, CLI."
requires-python = ">=3.14"
dependencies = ["pydantic>=2.7", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]

[tool.deptry.package_module_name_map]
pyyaml = "yaml"
