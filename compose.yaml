# Postgres for local development and tests: `docker compose up -d db`.
# The API and one agent in containers (migrates on start): `docker compose up -d --build api`.
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 2s
      retries: 15

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0  # the image serves on :80 as a non-root user
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/readyz')"]
      interval: 2s
      retries: 15

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: on-failure  # the first migration can beat a just-started Postgres
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      AGENT_URL: http://agent
      CONTEXT_API_URL: http://api:8000  # where the agent reaches the Context API
      CONTEXT_TOKEN_SECRET: ${CONTEXT_TOKEN_SECRET:?see .env.example}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}  # empty: the agent gives the fixed sample answer
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"  # no auth yet: keep it off the network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      retries: 10

volumes:
  db-data:
