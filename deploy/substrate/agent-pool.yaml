# Worker pool for agent actors: one gVisor worker per running job. The actor template is not a
# Kubernetes resource; see agent-template.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: justpass-agents
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: agent
  namespace: justpass-agents
  labels:
    workload: justpass-agent
spec:
  # One worker per job running at the same time, plus one for building the golden snapshot.
  replicas: 2
  workerImage: ${ATEWORKER_GVISOR_IMAGE}
  sandboxClasses:
  - name: gvisor
  template:
    # Sizes the worker pod; see agent-size.yaml.
    resources:
      limits:
        cpu: ${AGENT_CPU_MILLICORES}m
        memory: ${WORKER_MEMORY_MIB}Mi
      requests:
        cpu: ${WORKER_CPU_REQUEST_MILLICORES}m
        memory: ${WORKER_MEMORY_MIB}Mi
