# Worker pool for agent actors: one gVisor worker per running job. The actor template is not a
# Kubernetes resource; see agents.yaml, whose sandbox size must fit inside this worker.
apiVersion: v1
kind: Namespace
metadata:
  name: justpass-agents
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: agent
  namespace: justpass-agents
  labels:
    workload: justpass-agent
spec:
  # One worker per job running at the same time, plus one for building the golden snapshot.
  replicas: 2
  # Substrate's worker image of the release the cluster runs; keep it on that release.
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0
  sandboxClasses:
  - name: gvisor
  template:
    # The cluster autoscaler must not drain a node with a worker on it: the actor there would crash. Such a node is
    # freed only once its workers are rescheduled elsewhere, as on a rollout.
    annotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    # The worker is the sandbox (1 CPU, 512Mi in agents.yaml) plus gVisor and the worker itself.
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 1Gi
