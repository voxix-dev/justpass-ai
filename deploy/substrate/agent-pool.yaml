# Worker pool for agent actors: one gVisor worker per running job. The actor template is not a
# Kubernetes resource; see agents.yaml, whose sandbox size must fit inside this worker.
apiVersion: v1
kind: Namespace
metadata:
  name: justpass-agents
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: agent
  namespace: justpass-agents
  labels:
    workload: justpass-agent
spec:
  # One worker per job running at the same time, plus one for building the golden snapshot.
  replicas: 2
  # An overlay points this at the registry that holds the worker image, see deploy/local.
  workerImage: ateworker-gvisor:latest
  sandboxClasses:
  - name: gvisor
  template:
    # The worker is the sandbox (1 CPU, 512Mi in agents.yaml) plus gVisor and the worker itself.
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 1Gi
