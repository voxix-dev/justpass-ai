# How big an agent is: the only place to change it. deploy/local/deploy.sh fills the worker pool
# (agent-pool.yaml) and the actor template (agent-template.yaml) from these values, because neither
# reads a ConfigMap itself, and the sandbox must fit inside its worker.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-size
  namespace: justpass-agents
data:
  cpuMillicores: "1000" # the sandbox, and the worker's CPU limit
  memoryMiB: "512" # the sandbox
  workerOverheadMiB: "512" # gVisor and the worker itself, on top of the sandbox
  workerCpuRequestMillicores: "250"
