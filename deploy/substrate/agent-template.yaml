# ActorTemplate for the agent (protojson ateapipb.ActorTemplate, created through the ate API with
# `kubectl ate create actor-template -f -`, not a Kubernetes resource). deploy/kind/deploy.sh fills
# in the ${...} placeholders. Templates are immutable, so every image gets a template of its own.
metadata:
  atespace: justpass-agents
  name: ${ATE_TEMPLATE}
workerSelector:
  matchLabels:
    workload: justpass-agent
containers:
- name: agent
  image: ${AGENT_IMAGE} # must be pinned by digest
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 80
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 536870912 # 512Mi
snapshotConfig:
  # MEMORY: a suspend keeps the running process, so a job's conversation comes back for its feedback
  # rounds without code to save it. Postgres stays the source of truth.
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
