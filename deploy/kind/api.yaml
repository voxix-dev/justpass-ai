# The API and its Postgres on the local cluster, in the namespace and service account the Substrate
# router accepts (see env.sh). deploy.sh fills in the ${...} placeholders.
apiVersion: v1
kind: Namespace
metadata:
  name: homework
  labels:
    ate.dev/api-access: "true" # ate-api's NetworkPolicy refuses other namespaces
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: homework
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: homework
spec:
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: postgres
        image: docker.io/library/postgres:18.6
        env:
        - name: POSTGRES_USER
          value: app
        - name: POSTGRES_PASSWORD
          value: app
        - name: POSTGRES_DB
          value: app
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "app"]
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: homework
spec:
  selector:
    app: db
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: homework
spec:
  strategy:
    type: Recreate # a starting API re-runs unfinished rounds: not while the old one runs them
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      securityContext:
        runAsUser: 10001
        fsGroup: 10001 # so the image's user can read the private key below
      containers:
      - name: api
        image: ${API_IMAGE}
        env:
        - name: DATABASE_URL
          value: postgresql+asyncpg://app:app@db:5432/app
        - name: ATE_ROUTER_URL
          value: https://atenet-router.ate-system.svc
        - name: ATE_API_TARGET
          value: api.ate-system.svc:443
        - name: ATE_ATESPACE
          value: justpass-agents
        - name: ATE_TEMPLATE
          value: ${ATE_TEMPLATE}
        - name: ATE_CA_FILE
          value: /run/ate/ca/trust-bundle.pem
        - name: ATE_CLIENT_CERT_FILE
          value: /run/ate/identity/credential-bundle.pem
        - name: ATE_TOKEN_FILE
          value: /run/ate/token/token
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          periodSeconds: 2
        volumeMounts:
        - name: identity
          mountPath: /run/ate/identity
        - name: ca
          mountPath: /run/ate/ca
        - name: token
          mountPath: /run/ate/token
      volumes:
      # Client certificate and key for the router: this pod's SPIFFE ID.
      - name: identity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      # CA that signs the router's and ate-api's serving certificates.
      - name: ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      # Bearer token for ate-api, which checks it against the access policy.
      - name: token
        projected:
          sources:
          - serviceAccountToken:
              audience: api.ate-system.svc
              path: token
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: homework
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 8000
