# What an actor on kind may reach on this machine: the Context API, and nothing else of the API.
# The Jobs API has no auth yet, so /jobs and every other path is a 404 here, and a method but POST
# on the Context API's paths is a 403. The Context API checks its own token. nginx matches the path
# after decoding it and removing dot segments, so /v1/context/../jobs is a 404 too.
server {
    listen 8000;
    server_name _;
    client_max_body_size 1m;

    location /v1/context/ {
        limit_except POST {
            deny all;
        }
        proxy_pass http://unix:/run/context/api.sock:/v1/context/;
        proxy_redirect off;
        proxy_set_header Host $host;
        # uvicorn trusts these from 127.0.0.1, which is where context-uds connects from: an actor must
        # not choose the client address or scheme the API sees. An empty value drops the header.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
    }

    location / {
        return 404;
    }
}
