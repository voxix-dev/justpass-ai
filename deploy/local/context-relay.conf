# What an actor on kind may reach on this machine: the Context API, and nothing else of the API.
# The Jobs API has no auth yet, so /jobs and everything else is a 404 here, and so is any method
# but POST. The Context API checks its own token. nginx matches the path after decoding it and
# removing dot segments, so /v1/context/../jobs is a 404 too.
server {
    listen 8000;
    server_name _;
    client_max_body_size 1m;

    location /v1/context/ {
        limit_except POST {
            deny all;
        }
        proxy_pass http://unix:/run/context/api.sock:/v1/context/;
        proxy_redirect off;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
