# Turns the API on 127.0.0.1 of this machine into a unix socket that context-relay can reach through
# a shared volume. The container runs on the host network; the socket is its only listener.
# API_PORT is filled in by deploy/local/compose.yaml.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {}

stream {
    server {
        listen unix:/run/context/api.sock;
        proxy_pass 127.0.0.1:@API_PORT@;
    }
}
