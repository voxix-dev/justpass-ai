# Points the API from the root compose.yaml at the local Substrate cluster, instead of its one agent,
# and gives the actors a way to the Context API (and to nothing else on this machine):
#   podman compose -f compose.yaml -f deploy/local/compose.yaml up -d --build --wait api context-uds context-relay
# deploy.sh does this, after identity.sh and forward.sh. Relative paths start at the repo root.
# Every compose command with this file needs ATE_TEMPLATE, which deploy.sh sets. Any value will do for
# `logs` or `down`.
services:
  api:
    # Host network to reach the port-forwards, which listen on 127.0.0.1 only, and the published Postgres.
    network_mode: host
    ports: !reset []
    depends_on: !override
      db:
        condition: service_healthy
    # Same as the image's command, on 127.0.0.1: no auth yet, and the host network has no port mapping.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn api.main:app --host 127.0.0.1 --port ${API_PORT:-8000}"]
    # The names on the serving certificates, which are the ones to verify through a port-forward too.
    extra_hosts:
      - api.ate-system.svc:127.0.0.1
      - atenet-router.ate-system.svc:127.0.0.1
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@127.0.0.1:${DB_PORT:-5432}/app
      AGENT_URL: ""
      # What the agents call, and the one destination their egress policy allows. The Service has no
      # selector: deploy.sh points its EndpointSlice at context-relay below, which is how an actor on
      # kind gets to an API that listens on 127.0.0.1 of this machine.
      CONTEXT_API_URL: http://context-api.justpass-agents.svc.cluster.local:8000
      ATE_ROUTER_URL: https://atenet-router.ate-system.svc:${ATE_ROUTER_PORT:-9443}
      ATE_API_TARGET: api.ate-system.svc:${ATE_API_PORT:-8443}
      ATE_ATESPACE: justpass-agents
      ATE_TEMPLATE: ${ATE_TEMPLATE:?deploy.sh sets it}
      ATE_CA_FILE: /run/ate/trust-bundle.pem
      ATE_CLIENT_CERT_FILE: /run/ate/credential-bundle.pem
      ATE_TOKEN_FILE: /run/ate/token
    volumes:
      # The directory, not each file: identity.sh replaces files, and a file mount would keep the old one.
      # z: SELinux would refuse the container otherwise.
      - ./deploy/local/.identity/mounted:/run/ate:ro,z
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${API_PORT:-8000}/ready')"]

  # Actor -> atunnel -> atenet-egress -> Service context-api -> context-relay -> unix socket ->
  # context-uds -> the API. Rootless podman gives the kind network no route to the host's 127.0.0.1,
  # and the API must stay off the LAN, so the hop between the two is a socket in a volume.
  # Both run as uid 101. podman gives a new volume to the container's user; docker would need it chowned.
  context-uds:
    image: docker.io/nginxinc/nginx-unprivileged:1.29.8-alpine
    # The host's network, to reach the API on 127.0.0.1. It listens on the socket only.
    network_mode: host
    command:
      - sh
      - -c
      - sed "s/@API_PORT@/${API_PORT:-8000}/" /etc/nginx/context-uds.conf > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g "daemon off;"
    volumes:
      - ./deploy/local/context-uds.conf:/etc/nginx/context-uds.conf:ro,z
      - context-socket:/run/context
    healthcheck:
      test: ["CMD", "test", "-S", "/run/context/api.sock"]
      interval: 2s
      retries: 15

  # Listens on the kind network, so the cluster can reach it, and lets through only POSTs to the
  # Context API: the Jobs API has no auth, and an actor must not see it. See the conf.
  context-relay:
    image: docker.io/nginxinc/nginx-unprivileged:1.29.8-alpine
    networks:
      kind: {}
    volumes:
      - ./deploy/local/context-relay.conf:/etc/nginx/conf.d/default.conf:ro,z
      - context-socket:/run/context
    healthcheck:
      test: ["CMD-SHELL", "wget -qS -O /dev/null http://127.0.0.1:8000/ 2>&1 | grep -q '404 Not Found'"]
      interval: 2s
      retries: 15

networks:
  kind:
    external: true  # created by kind; deploy.sh needs the cluster up first

volumes:
  context-socket:
