name: deploy

# Deploys the API to Cloud Run after ci passes on main. Terraform (deploy/terraform/prod) creates the service
# and the identity used here; it prints the repository variables below. Without GCP_PROJECT_ID nothing runs.
#   GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SERVICE_ACCOUNT, GCP_IMAGE_REPOSITORY

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  api:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
      && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token that Workload Identity Federation exchanges; no key files
    env:
      IMAGE: ${{ vars.GCP_IMAGE_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}
    steps:
      # An older ci run that finishes late must not roll back a newer deploy.
      - id: tip
        name: Skip unless this is the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::Skipping the deploy of $SHA: main is at $tip"
          fi
      - if: steps.tip.outputs.current == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - if: steps.tip.outputs.current == 'true'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
      - if: steps.tip.outputs.current == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.tip.outputs.current == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - if: steps.tip.outputs.current == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=gcp-api
          cache-to: type=gha,scope=gcp-api,mode=max,ignore-error=true
      - if: steps.tip.outputs.current == 'true'
        name: Deploy to Cloud Run
        run: deploy/gcp/deploy-api.sh
        env:
          # By digest, not by tag: a tag can move, so the revision check proves this exact build is serving.
          IMAGE: ${{ vars.GCP_IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
