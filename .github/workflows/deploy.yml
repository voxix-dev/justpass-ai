name: deploy

# After ci passes on main, deploys the tip of main: the API to Cloud Run, then the web app to Firebase Hosting, which
# rewrites /api/** to Cloud Run. The API image is the one ci's `images` job pushed to GHCR; it is deployed by digest
# through the Artifact Registry remote repository that proxies GHCR. Terraform (deploy/terraform/prod) creates the
# service, the Firebase project and the identity used here; it prints the repository variables below. Without
# GCP_PROJECT_ID nothing runs.
#   GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SERVICE_ACCOUNT
#   GCP_IMAGE_REPOSITORY (<region>-docker.pkg.dev/<project>/ghcr/voxix-dev/justpass-ai/api)

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  api:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
      && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token that Workload Identity Federation exchanges; no key files
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      # An older ci run that finishes late must not roll back a newer deploy.
      - id: tip
        name: Skip unless this is the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::Skipping the deploy of $SHA: main is at $tip"
          fi
      - if: steps.tip.outputs.current == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - if: steps.tip.outputs.current == 'true'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
      - if: steps.tip.outputs.current == 'true'
        id: image
        name: Resolve the digest of the image ci pushed
        env:
          REF: ghcr.io/voxix-dev/justpass-ai/api:${{ github.event.workflow_run.head_sha }}
        # Cloud Run swaps an index digest for its linux/amd64 image's, so take that one or the revision check fails.
        run: |
          digest=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -r '
            if .manifests then .manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")
            | .digest else .digest end')
          case "$digest" in sha256:*) ;; *) echo "::error::No image $REF; did the ci images job push it?"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - if: steps.tip.outputs.current == 'true'
        name: Deploy to Cloud Run
        run: deploy/gcp/deploy-api.sh
        env:
          # By digest, not by tag: a tag can move, so the revision check proves this exact build is serving.
          IMAGE: ${{ vars.GCP_IMAGE_REPOSITORY }}@${{ steps.image.outputs.digest }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}

  web:
    needs: api
    if: needs.api.result == 'success' && needs.api.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - name: Point the /api/** rewrite at the Cloud Run region
        env:
          REGION: ${{ vars.GCP_REGION }}
        run: |
          jq --arg region "$REGION" '(.hosting.rewrites[] | select(.run) | .run.region) = $region' firebase.json > firebase.json.new
          mv firebase.json.new firebase.json
      - name: Deploy to Firebase Hosting
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: npx --yes firebase-tools@15.36.0 deploy --only hosting --project "$PROJECT_ID" --non-interactive
