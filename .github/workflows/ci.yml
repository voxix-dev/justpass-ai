name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run lint-imports
      - name: deptry
        run: for p in apps/api apps/agent packages/shared; do (cd "$p" && uv run deptry src) || exit 1; done
      - run: uv run pytest --cov --cov-report=xml
      - name: coverage of changed lines
        if: github.event_name == 'pull_request'
        run: uv run diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=70
      - name: API contract is up to date
        run: |
          uv run python -m api.export_openapi
          test -z "$(git status --porcelain contracts/)" || { git status contracts/; exit 1; }
      - name: Generated protobuf code is up to date
        run: |
          uv run python -m grpc_tools.protoc -I apps/api/src/api --python_out=apps/api/src/api \
            --pyi_out=apps/api/src/api apps/api/src/api/ate.proto
          test -z "$(git status --porcelain "apps/api/src/api/*_pb2.py*")" || { git diff apps/api/src/api; exit 1; }

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.75.0
      - run: buf lint
      - run: buf format --diff --exit-code

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: API types match the contract
        run: pnpm gen:api && git diff --exit-code src/api/schema.gen.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres, the agent and the API
        run: docker compose up -d --build --wait api
        working-directory: .
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: API and database logs
        if: failure()
        run: docker compose logs
        working-directory: .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive deploy/terraform
      - name: Validate the production and local roots
        run: |
          for d in prod local; do
            terraform -chdir=deploy/terraform/$d init -backend=false -input=false
            terraform -chdir=deploy/terraform/$d validate
          done
      - name: Test the module
        run: |
          terraform -chdir=deploy/terraform/modules/api init -backend=false -input=false
          terraform -chdir=deploy/terraform/modules/api test

  # The module and the deploy script against floci-gcp, which runs Cloud SQL and Cloud Run as containers.
  gcp-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false # the script reads `terraform output`
      - run: ENGINE=docker deploy/gcp/local-e2e.sh
      - name: floci-gcp logs
        if: failure()
        run: docker logs floci-gcp

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    needs: [python, web, e2e, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, agent]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          tags: ghcr.io/voxix-dev/justpass-ai/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max,ignore-error=true
