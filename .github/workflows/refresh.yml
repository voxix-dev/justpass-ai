name: refresh

# Does nothing itself: its run triggers the deploy workflow, which then only reruns the `cluster` job, so the API's
# 48-hour cluster credentials are renewed daily (or on demand) without a deploy.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - run: "true"
